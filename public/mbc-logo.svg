<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Text Paths for Curving Text -->
    <!-- Upper arc for school name -->
    <path id="upper-arc" d="M 65,250 A 185,185 0 1,1 435,250" fill="none" />
    <!-- Lower arc for location -->
    <path id="lower-arc" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
    
    <!-- Gradients -->
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="wing-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="wing-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <linearGradient id="blue-gear-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Red Ring with Black Border -->
  <circle cx="250" cy="250" r="236" fill="#e52421" stroke="#111827" stroke-width="12" />

  <!-- 2. Inner Rim of Red Ring -->
  <circle cx="250" cy="250" r="156" fill="#ffffff" stroke="#111827" stroke-width="8" />

  <!-- 3. Thai Text Along Upper Arc -->
  <text font-family="'Sarabun', 'Prompt', 'Noto Sans Thai', 'Thonburi', sans-serif" font-size="33" font-weight="900" fill="#111827" letter-spacing="1">
    <textPath href="#upper-arc" startOffset="50%" text-anchor="middle">
      วิทยาลัยเทคโนโลยีหมู่บ้านครู
    </textPath>
  </text>

  <!-- 4. Thai Text Along Lower Arc -->
  <text font-family="'Sarabun', 'Prompt', 'Noto Sans Thai', 'Thonburi', sans-serif" font-size="28" font-weight="900" fill="#111827" letter-spacing="2">
    <textPath href="#lower-arc" startOffset="50%" text-anchor="middle">
      เขตหนองแขม   กรุงเทพมหานคร
    </textPath>
  </text>

  <!-- 5. Blue Cogwheel (16 Teeth) Inside Center -->
  <g transform="translate(250, 250)">
    <!-- 16 Teeth Cogwheel -->
    <path fill="url(#blue-gear-grad)" stroke="#0f172a" stroke-width="3" d="
      M 0,-154
      L 15,-154 L 18,-136 L 43,-146 L 56,-140 L 46,-122 L 73,-127 L 85,-116 L 68,-102 L 97,-98 L 108,-83 L 86,-74 L 115,-62 L 122,-45 L 98,-42 L 126,-23 L 128,-5 L 103,-9 L 127,14 L 123,31 L 99,23 L 118,48 L 110,64 L 88,52 L 102,78 L 90,92 L 70,76 L 80,103 L 64,114 L 48,94 L 54,121 L 36,128 L 24,105 L 25,132 L 6,135 L 0,110
      L -6,135 L -25,132 L -24,105 L -36,128 L -54,121 L -48,94 L -64,114 L -80,103 L -70,76 L -90,92 L -102,78 L -88,52 L -110,64 L -118,48 L -99,23 L -123,31 L -127,14 L -103,-9 L -128,-5 L -126,-23 L -98,-42 L -122,-45 L -115,-62 L -86,-74 L -108,-83 L -97,-98 L -68,-102 L -85,-116 L -73,-127 L -46,-122 L -56,-140 L -43,-146 L -18,-136 L -15,-154 Z
    " />
    
    <!-- White Inner Hub of the Cogwheel -->
    <circle cx="0" cy="0" r="105" fill="#ffffff" stroke="#0f172a" stroke-width="5" />
  </g>

  <!-- 6. Elements Inside the White Center -->
  <!-- 6.1 Top: Golden Buddha Statue on Pedestal -->
  <g transform="translate(250, 192)">
    <!-- Aura / Halo / Flame Top -->
    <path d="M 0,-52 Q 5,-40 0,-32 Q -5,-40 0,-52 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Head -->
    <circle cx="0" cy="-26" r="8" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Torso and Robes (Meditation pose) -->
    <path d="M -12,-16 Q 0,-18 12,-16 L 15,3 Q 0,8 -15,3 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Arms and Crossed Legs -->
    <path d="M -22,6 Q 0,-2 22,6 Q 24,14 0,16 Q -24,14 -22,6 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Lotus / Tiered Base -->
    <path d="M -26,16 L 26,16 L 22,23 L -22,23 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
    <path d="M -30,23 L 30,23 L 26,30 L -26,30 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
  </g>

  <!-- 6.2 Lower Left: Blue Sailboat on Ocean Waves (Commerce & Technology) -->
  <g transform="translate(195, 290)">
    <!-- Water Waves -->
    <path d="M -35,16 Q -20,10 -5,16 Q 10,22 25,16 Q 35,12 40,16" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
    <path d="M -30,23 Q -15,18 0,23 Q 15,28 30,23" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
    <!-- Boat Hull -->
    <path d="M -26,8 L 22,8 L 16,16 L -18,16 Z" fill="#1e3a8a" stroke="#172554" stroke-width="2" />
    <!-- Large Main Sail -->
    <path d="M -12,6 Q -18,-18 -4,-28 Q 12,-8 10,6 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" />
    <!-- Front Jib Sail -->
    <path d="M 12,6 Q 8,-12 24,-2 Q 18,4 14,6 Z" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5" />
    <!-- Mast -->
    <line x1="-3" y1="6" x2="-3" y2="-32" stroke="#172554" stroke-width="2" />
  </g>

  <!-- 6.3 Lower Right: Golden Traditional Pagoda / Pavilion -->
  <g transform="translate(305, 290)">
    <!-- Pagoda Base -->
    <path d="M -18,16 L 18,16 L 15,22 L -15,22 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Middle Tier -->
    <path d="M -14,6 L 14,6 L 12,14 L -12,14 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Roof Tier 1 -->
    <path d="M -18,4 L 18,4 L 14,-4 L -14,-4 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Spire / Mandapa -->
    <path d="M -10,-4 L 10,-4 L 0,-28 Z" fill="url(#gold-grad)" stroke="#92400e" stroke-width="1.5" />
    <!-- Spire tip -->
    <line x1="0" y1="-28" x2="0" y2="-36" stroke="#92400e" stroke-width="2" />
  </g>

  <!-- 7. Superimposed Three-Winged Red Emblem (Center Symbol with 3D Bevel) -->
  <!-- Hub at center (250, 260) with 3 arms: Arm 1 (Down), Arm 2 (Up-Left), Arm 3 (Up-Right) -->
  <g transform="translate(250, 260)">
    <!-- Thin outer stroke for emblem -->
    <g stroke="#ffffff" stroke-width="2" stroke-linejoin="round">
      <!-- 7.1 Downward Wing (Bottom) -->
      <!-- Left facet of bottom wing -->
      <polygon points="0,0 0,98 -16,12" fill="url(#wing-light)" stroke="#7f1d1d" stroke-width="1.5" />
      <!-- Right facet of bottom wing -->
      <polygon points="0,0 0,98 16,12" fill="url(#wing-dark)" stroke="#7f1d1d" stroke-width="1.5" />

      <!-- 7.2 Upper-Left Wing -->
      <!-- Top facet of upper-left wing -->
      <polygon points="0,0 -96,-48 -10,-18" fill="url(#wing-light)" stroke="#7f1d1d" stroke-width="1.5" />
      <!-- Bottom facet of upper-left wing -->
      <polygon points="0,0 -96,-48 -16,12" fill="url(#wing-dark)" stroke="#7f1d1d" stroke-width="1.5" />

      <!-- 7.3 Upper-Right Wing -->
      <!-- Top facet of upper-right wing -->
      <polygon points="0,0 96,-48 10,-18" fill="url(#wing-dark)" stroke="#7f1d1d" stroke-width="1.5" />
      <!-- Bottom facet of upper-right wing -->
      <polygon points="0,0 96,-48 16,12" fill="url(#wing-light)" stroke="#7f1d1d" stroke-width="1.5" />
    </g>

    <!-- Center Hub Button -->
    <circle cx="0" cy="0" r="10" fill="#dc2626" stroke="#7f1d1d" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#fca5a5" />
  </g>
</svg>
